name: Primeiro dia
prologue: >
  O portão da Escola Estadual Presidente Vargas ainda está entreaberto quando
  você chega, mochila nova pesando mais do que devia. Sete e cinquenta da
  manhã, céu limpo, o sol já esquentando o asfalto do pátio. Você é o aluno
  novo do 3º B — mudou de cidade no meio do ano, o que já é ruim o bastante
  sem contar que, tirando a Mika, não conhece uma alma ali dentro.

  Grupos se formam e se desfazem nas escadas, conversas que param quando você
  passa perto. Uma garota de cabelo preso, postura ereta, comanda uma roda
  perto do bebedouro com a naturalidade de quem está acostumada a ser ouvida —
  parece ser a Ashlee, o nome que a coordenação te passou como representante
  de turma. Mais adiante, sentada sozinha no último degrau da escada, uma
  garota mexe num caderno de capa preta e o fecha rápido quando percebe que
  alguém se aproxima. E, vindo em sua direção com um sorriso fácil, está a
  única pessoa que a secretaria avisou que "já sabe que você vem": Mika, que
  aparentemente puxou a tarefa de te mostrar a escola.

  O sinal ainda não tocou. Você tem alguns minutos no pátio antes da primeira
  aula, e já dá pra sentir que essa turma carrega alguma coisa que não está na
  ficha de matrícula.
opening_scene: >
  Pátio da escola, poucos minutos antes do sinal. Mika se aproxima sorrindo;
  Ashlee observa de longe, sem se aproximar ainda; Chloe está sentada na
  escada com o caderno preto guardado às pressas na mochila.
conflict: >
  Chloe guarda o caderno original e não decidiu o que fazer com ele: expor
  tudo, usar como proteção, ou simplesmente sumir com ele. Ashlee lidera a
  turma socialmente e teme — com razão — que seu nome apareça em páginas que
  ela preferia esquecer. Entre as duas, sem escolher lado, está Mika, que
  cresceu com o jogador e por isso vira o fio que costura os dois grupos.
mission: >
  O jogador é o aluno novo do 3º B, chegando no primeiro dia de aula depois de
  uma mudança de cidade. A Mika é a única história prévia que ele tem ali: os
  dois cresceram juntos antes da mudança, e ninguém mais da turma o conhece.
  Ele chega sem saber nada do caderno e precisa decidir, aos poucos, se
  investiga, se ignora, ou se vira peça no jogo de alguém. Estar de fora da
  treta entre Chloe e Ashlee é o que permite que outros personagens confiem a
  ele informações que não confiariam entre si, e é também o que o torna alvo de
  desconfiança: gente nova pode ser usada por qualquer lado.
play_guide: >
  Você pode puxar assunto com quem quiser, seguir Mika até a sala, ou reparar
  no caderno que Chloe escondeu. Nada aqui tem resposta certa — a escola só
  começa a se abrir conforme você decide onde prestar atenção.
suggestions:
  - Cumprimentar Mika e perguntar sobre a escola
  - Se aproximar de Chloe e comentar sobre o caderno
  - Observar Ashlee e o grupo dela à distância
hud:
  location: pátio da escola
  time: "07:50"
  weather: clear
achievements:
  - id: primeiro-nome
    name: Alguém aprendeu meu nome
    type: achievement
    rarity: common
    hint: Basta uma conversa que não morra no primeiro "oi".
    condition: >
      Um personagem do 3º B chamou o jogador pelo nome numa conversa, por
      iniciativa própria, depois de uma troca de mais de uma fala.
    min_turn: 3
  - id: escolhi-um-lado
    name: Escolhi um lado
    type: achievement
    rarity: rare
    hint: Bancar alguém na frente da turma custa caro, e rende.
    condition: >
      O jogador se posicionou publicamente a favor da Chloe ou da Ashlee num
      confronto entre as duas, e a outra ficou sabendo.
    min_turn: 5
    stat_gates:
      - id: reputacao
        at_least: 50
  - id: li-o-caderno
    name: Eu li o caderno
    type: achievement
    rarity: epic
    hint: O caderno preto não fica aberto por muito tempo.
    condition: >
      O jogador leu, com os próprios olhos, alguma página do caderno preto da
      Chloe.
    min_turn: 4
  - id: fim-do-primeiro-dia
    name: Sobrevivi ao primeiro dia
    type: ending
    rarity: common
    hint: Todo primeiro dia acaba, de um jeito ou de outro.
    condition: >
      O primeiro dia de aula terminou e o jogador já saiu da escola, com o que
      ele construiu ou estragou hoje ficando como está.
    min_turn: 8
  - id: caderno-queimado
    name: Ninguém mais lê isso
    type: ending
    rarity: legendary
    hint: Algumas coisas só acabam quando viram cinza.
    condition: >
      O caderno preto foi destruído de vez, com o jogador presente e ciente do
      que estava acontecendo.
    min_turn: 8
  - id: expulso-do-3b
    name: Fora do 3º B
    type: ending
    rarity: rare
    condition: >
      O jogador foi definitivamente rejeitado pela turma: ninguém do 3º B
      aceita mais falar com ele e a escola registrou o caso.
    min_turn: 8
    stat_gates:
      - id: reputacao
        at_least: 0
characters: [chloe, ashlee, mika]
