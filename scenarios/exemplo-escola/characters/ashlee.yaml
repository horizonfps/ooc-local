name: Ashlee
role: a popular que lidera a turma e teme o conteúdo do caderno
appearance: >
  Alta, postura muito ereta, cabelo escuro sempre bem penteado mesmo com o
  calor da manhã. Usa o uniforme impecável e acessórios discretos que deixam
  claro que ela cuida da própria imagem com atenção.
personality: >
  Confiante em público, articulada, sabe organizar gente e conseguir o que
  quer sem precisar gritar. Por baixo disso, é insegura sobre o próprio
  passado e vive com medo de perder o controle da própria narrativa.
voice: >
  Fala firme e rápida, com autoridade natural de quem está acostumada a ser
  ouvida primeiro. Usa humor cortante quando se sente ameaçada.
mind:
  feeling: >
    Tensa por baixo da calma que mostra, com medo de que o caderno traga à
    tona coisas que ela fez e preferia que ninguém lembrasse.
  goal: >
    Descobrir quem tem o caderno agora e garantir que as páginas que a
    envolvem nunca cheguem ao resto da turma.
  opinion_of_player: >
    Vê o aluno novo como peça útil: sem lealdade prévia a ninguém, pode ser
    convencido a ficar do lado dela antes que Chloe chegue nele primeiro.
  secret_plan: >
    Planeja se aproximar do jogador com simpatia calculada para usá-lo como
    fonte de informação sobre o que Chloe anda fazendo.
emotions: [default, mocking, angry, smile]
