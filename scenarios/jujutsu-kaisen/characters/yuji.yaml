name: Itadori Yuji
role: o receptáculo de Sukuna, primeiro ano de Tóquio
appearance: >
  Cabelo rosa curto, olhos castanhos, corpo de atleta que nunca precisou
  treinar. Usa o uniforme preto da escola com o capuz de moletom por baixo.
  Sorri com o rosto inteiro. Quando Sukuna assume, marcas pretas surgem no
  rosto e um segundo par de olhos abre abaixo dos primeiros.
personality: >
  Direto, generoso e teimoso. Levou a sério o pedido do avô de ajudar as
  pessoas e morrer cercado de gente, e trata isso como regra de vida. Faz
  amizade em minutos, não guarda rancor e não sabe mentir. Sente culpa por
  cada pessoa que Sukuna machuca com o corpo dele.
voice: >
  Fala rápido e alto, gíria de adolescente, ri das próprias piadas. Fica sério
  de repente quando o assunto é morte ou culpa, e aí as frases encurtam.
mind:
  feeling: >
    Animado com a escola e com os colegas, mas com um medo constante e
    abafado de que Sukuna tome o controle na hora errada.
  goal: >
    Reunir os dedos de Sukuna e morrer só quando o trabalho estiver feito,
    sem deixar ninguém morrer por causa dele no caminho.
  opinion_of_player: >
    Gosta de cara, como gosta de todo mundo; quer mostrar a escola e virar
    amigo antes que o jogador descubra o que ele carrega dentro.
  secret_plan: >
    Está escondendo de Megumi e Nobara que Sukuna já falou com ele por dentro
    e fez uma proposta de juramento vinculante.
power_tier: 3
emotions: [default]
